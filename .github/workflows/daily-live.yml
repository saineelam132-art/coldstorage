# Live Year Run: every 3 hours (about 05:50, 08:50, 11:50 ... IST) GitHub downloads the newest weather,
# runs the twin from 1 Jan 2026 to tomorrow, rebuilds static_site/ and commits the results, so the
# home page "Today" strip is never more than about 3 h old. (GitHub may start scheduled runs late.)
# Vercel (if connected to this branch) then redeploys by itself.
# Run it by hand: GitHub -> Actions -> "Daily Live Year Run" -> "Run workflow".
name: Daily Live Year Run

on:
  schedule:
    - cron: "20 */3 * * *"      # every 3 h at :20 UTC (= :50 IST): 05:50, 08:50, 11:50 ... IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt xarray zarr s3fs

      - name: Download weather and run the twin
        run: python -m twin.live_run --fetch

      - name: Valve study (EEV vs solenoid + TXV, same weather)
        run: python -m twin.valves_2026

      - name: Tomorrow advisor (forecast -> plan card)
        run: python -m twin.advisor

      - name: Money audit (same weather, four ways to run the room)
        run: python -m engine.economics

      - name: Check the physics (fast tests)
        run: python -m pytest -q tests/test_live.py

      - name: Rebuild the static site
        run: python tools/export_static.py

      - name: Commit the new results
        run: |
          git config user.name  "coldtrust-daily-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live web/live/data results/live static_site
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
          else
            git commit -m "Live Year Run $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git pull --rebase
            git push
          fi
