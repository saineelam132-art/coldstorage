<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Freshness Check – KoolKisaan</title>
<meta name="description" content="KoolKisaan batch freshness check: storage temperature history and ledger verification.">
<link rel="icon" type="image/png" sizes="64x64" href="public/favicon-64.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<meta name="theme-color" content="#06121f">
<style>
  :root{--ink:#0d1b2a;--ink2:#41566b;--line:#d5e2ec;--teal:#14b8a6;--green:#15803d;--red:#b91c1c;--amber:#b45309}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#eef4f8;color:var(--ink)}
  header{background:#06121f;color:#fff;padding:14px 16px}
  header b{font-size:18px} header small{display:block;color:#a9bccd}
  main{padding:14px 16px 30px;max-width:560px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .id{font:700 22px Consolas,monospace;color:#2a78d6}
  .verdict{font-size:22px;font-weight:800;padding:14px;border-radius:12px;text-align:center}
  .verdict.ok{background:#dcfce7;color:var(--green)} .verdict.bad{background:#fee2e2;color:var(--red)}
  .verdict small{display:block;font-size:13px;font-weight:500;margin-top:4px;color:var(--ink2)}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
  .kv b{text-align:right}
  .big{font-size:40px;font-weight:800}
  .bar{height:12px;background:#e3ecf3;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%}
  canvas{width:100%;height:150px}
  .warn{background:#fff4e0;border-left:4px solid #f59e0b;padding:8px 10px;border-radius:6px;font-size:14px;margin-top:8px}
  .note{font-size:12px;color:#7b8a99}
  table{width:100%;border-collapse:collapse;font-size:13px} td{padding:5px 3px;border-bottom:1px solid var(--line)}
  .h{font:11px Consolas,monospace;color:#64748b}
</style>
</head>
<body>
<header><b><img src="public/koolkisaan-logo-small.png" alt="KoolKisaan logo" style="height:34px;vertical-align:middle;margin-right:8px">Cold-chain freshness check</b><small>KoolKisaan solar–PCM cold room · Visakhapatnam</small></header>
<main id="m"><div class="card">Loading batch…</div></main>
<script src="js/data.js"></script>
<script src="js/buyer.bundle.js"></script>
</body>
</html>
